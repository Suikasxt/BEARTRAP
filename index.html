<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bear Trap Hex Game</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div id="top-ui">
    <div class="desc">
      点击格子放障碍，围住猫。猫会贪心地走当前最短路（如果存在多条路径则随机）。
    </div>
    <div id="status"></div>
  </div>

  <div id="board"></div>

  <div id="bottom-ui">
    <button onclick="resetGame()">重开</button>
    <button onclick="undo()">悔棋</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
